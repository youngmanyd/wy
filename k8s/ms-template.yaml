---
# Template for UAV Edge Microservice Deployment
# Variables replaced by deploy.sh:
#   ${MS_NAME}, ${MS_ROLE}, ${MS_PORT}, ${REPLICAS},
#   ${CPU_REQ}, ${CPU_LIM}, ${MEM_REQ}, ${MEM_LIM},
#   ${DOWNSTREAM_URLS}, ${NODE_SELECTOR}, ${OMP_THREADS},
#   ${IMAGE_REPO}, ${IMAGE_TAG}, ${NAMESPACE}
apiVersion: v1
kind: Service
metadata:
  name: ${MS_NAME}
  namespace: ${NAMESPACE}
  labels:
    app: ${MS_NAME}
    tier: uav-edge
spec:
  selector:
    app: ${MS_NAME}
  ports:
    - port: ${MS_PORT}
      targetPort: ${MS_PORT}
      protocol: TCP
      name: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${MS_NAME}
  namespace: ${NAMESPACE}
  labels:
    app: ${MS_NAME}
    tier: uav-edge
spec:
  replicas: ${REPLICAS}
  selector:
    matchLabels:
      app: ${MS_NAME}
  template:
    metadata:
      labels:
        app: ${MS_NAME}
        tier: uav-edge
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "${MS_PORT}"
        prometheus.io/path: "/metrics"
    spec:
      ${NODE_SELECTOR}
      containers:
        - name: ${MS_NAME}
          image: ${IMAGE_REPO}:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: ${MS_PORT}
          env:
            - name: MS_ROLE
              value: "${MS_ROLE}"
            - name: MS_PORT
              value: "${MS_PORT}"
            - name: DOWNSTREAM_URLS
              value: "${DOWNSTREAM_URLS}"
            - name: ONNX_MODEL_PATH
              value: "/app/models/yolov8n.onnx"
            - name: OMP_NUM_THREADS
              value: "${OMP_THREADS}"
            - name: MKL_NUM_THREADS
              value: "${OMP_THREADS}"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger.${NAMESPACE}.svc.cluster.local:4317"
            - name: FUSION_TIMEOUT
              value: "5.0"
            - name: HTTP_TIMEOUT
              value: "10.0"
            - name: TARGET_PREPROC_PAYLOAD
              value: "204800"
            - name: TARGET_DETECT_PAYLOAD
              value: "819200"
          resources:
            requests:
              cpu: "${CPU_REQ}"
              memory: "${MEM_REQ}"
            limits:
              cpu: "${CPU_LIM}"
              memory: "${MEM_LIM}"
          readinessProbe:
            httpGet:
              path: /health
              port: ${MS_PORT}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: ${MS_PORT}
            initialDelaySeconds: 30
            periodSeconds: 15
