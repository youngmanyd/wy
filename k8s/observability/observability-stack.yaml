---
# =============================================================================
# UAV Edge Observability Stack
# Components: Jaeger (tracing), Prometheus (metrics), Kubenurse (network RTT)
# =============================================================================

# ---- Jaeger (v2.17.0 — unified binary) ----
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: uav-edge
  labels:
    app: jaeger
spec:
  selector:
    app: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: ui
      port: 16686
      targetPort: 16686
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: uav-edge
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      nodeSelector:
        node-role.kubernetes.io/master: "true"
      containers:
        - name: jaeger
          image: docker.io/jaegertracing/jaeger:2.17.0
          imagePullPolicy: Never
          ports:
            - containerPort: 4317
            - containerPort: 4318
            - containerPort: 16686
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
# ---- Prometheus ----
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: uav-edge
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: 'uav-microservices'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [uav-edge]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: service_name
      - job_name: 'kubenurse'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [uav-edge]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: kubenurse
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            regex: (.+)
            replacement: $1:8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: uav-edge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-uav-edge
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-uav-edge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-uav-edge
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: uav-edge
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: uav-edge
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: uav-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      nodeSelector:
        node-role.kubernetes.io/master: "true"
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          imagePullPolicy: Never
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=7d'
            - '--web.enable-lifecycle'
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
# ---- Kubenurse DaemonSet ----
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubenurse
  namespace: uav-edge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubenurse
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubenurse
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubenurse
subjects:
  - kind: ServiceAccount
    name: kubenurse
    namespace: uav-edge
---
apiVersion: v1
kind: Service
metadata:
  name: kubenurse
  namespace: uav-edge
spec:
  selector:
    app: kubenurse
  ports:
    - port: 8080
      targetPort: 8080
  clusterIP: None
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kubenurse
  namespace: uav-edge
spec:
  selector:
    matchLabels:
      app: kubenurse
  template:
    metadata:
      labels:
        app: kubenurse
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: kubenurse
      hostNetwork: true
      hostIPC: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: kubenurse
          image: postfinance/kubenurse:v1.13.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              hostPort: 8080
          env:
            - name: KUBENURSE_INGRESS_URL
              value: ""
            - name: KUBENURSE_SERVICE_URL
              value: "http://kubenurse.uav-edge.svc.cluster.local:8080"
            - name: KUBENURSE_INSECURE
              value: "true"
            - name: KUBENURSE_ROUND_TRIP_CHECK
              value: "true"
            - name: KUBENURSE_NAMESPACE
              value: "uav-edge"
            - name: KUBENURSE_NEIGHBOUR_FILTER
              value: "app=kubenurse"
            - name: KUBENURSE_CHECK_INTERVAL
              value: "5s"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
