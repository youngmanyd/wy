---
apiVersion: v1
kind: Service
metadata:
  name: rgb-detector
  namespace: uav-edge
  labels:
    app: rgb-detector
    tier: uav-edge
spec:
  selector:
    app: rgb-detector
  ports:
    - port: 8004
      targetPort: 8004
      protocol: TCP
      name: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rgb-detector
  namespace: uav-edge
  labels:
    app: rgb-detector
    tier: uav-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rgb-detector
  template:
    metadata:
      labels:
        app: rgb-detector
        tier: uav-edge
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8004"
        prometheus.io/path: "/metrics"
    spec:
      # Node3: most capable UAV (4 CPU / 8GB)
      nodeSelector:
        kubernetes.io/hostname: "uav-node3"
      containers:
        - name: rgb-detector
          image: uav-edge-detector:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8004
          env:
            - name: SERVICE_ROLE
              value: "rgb-detector"
            - name: SERVICE_PORT
              value: "8004"
            - name: DOWNSTREAM_URLS
              value: "http://feature-fusion.uav-edge.svc.cluster.local:8006"
            - name: ONNX_MODEL_PATH
              value: "/app/models/yolov8n.onnx"
            - name: OMP_NUM_THREADS
              value: "1"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger.uav-edge.svc.cluster.local:4317"
            - name: TARGET_DETECT_PAYLOAD
              value: "819200"
            - name: HTTP_TIMEOUT
              value: "10.0"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 30
            periodSeconds: 15
