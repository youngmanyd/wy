apiVersion: v1
kind: Service
metadata:
  name: rgb-detector
  namespace: uav-edge
  labels:
    app: rgb-detector
spec:
  selector:
    app: rgb-detector
  ports:
    - port: 8004
      targetPort: 8000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rgb-detector
  namespace: uav-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rgb-detector
  template:
    metadata:
      labels:
        app: rgb-detector
    spec:
      nodeSelector:
        kubernetes.io/hostname: uav-node3
      containers:
        - name: rgb-detector
          image: uav-edge-rgb-detector:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_ROLE
              value: "rgb-detector"
            - name: SERVICE_PORT
              value: "8000"
            - name: DOWNSTREAM_URLS
              value: "http://feature-fusion:8006"
            - name: ONNX_MODEL_PATH
              value: "/app/models/yolov8n.onnx"
            - name: OMP_NUM_THREADS
              value: "1"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger:4317"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
