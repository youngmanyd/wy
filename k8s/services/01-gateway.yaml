apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: uav-edge
  labels:
    app: gateway
spec:
  selector:
    app: gateway
  ports:
    - port: 8001
      targetPort: 8000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: uav-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      nodeSelector:
        node-role.kubernetes.io/master: "true"
      containers:
        - name: gateway
          image: uav-edge-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_ROLE
              value: "gateway"
            - name: SERVICE_PORT
              value: "8000"
            - name: DOWNSTREAM_URLS
              value: "http://rgb-preprocessor:8002,http://ir-preprocessor:8003"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger:4317"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
