apiVersion: v1
kind: Service
metadata:
  name: ir-detector
  namespace: uav-edge
  labels:
    app: ir-detector
spec:
  selector:
    app: ir-detector
  ports:
    - port: 8005
      targetPort: 8000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ir-detector
  namespace: uav-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ir-detector
  template:
    metadata:
      labels:
        app: ir-detector
    spec:
      nodeSelector:
        kubernetes.io/hostname: uav-node1
      containers:
        - name: ir-detector
          image: uav-edge-ir-detector:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_ROLE
              value: "ir-detector"
            - name: SERVICE_PORT
              value: "8000"
            - name: DOWNSTREAM_URLS
              value: "http://feature-fusion:8006"
            - name: ONNX_MODEL_PATH
              value: "/app/models/yolov8n.onnx"
            - name: OMP_NUM_THREADS
              value: "1"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger:4317"
          resources:
            requests:
              cpu: "300m"
              memory: "384Mi"
            limits:
              cpu: "800m"
              memory: "768Mi"
